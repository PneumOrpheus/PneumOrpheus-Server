trigger:
  branches:
    include:
      - production

pr:
  branches:
    include:
      - production

variables:
  agentPoolName: "PneumOrpheusPool"
  pythonVersion: "3.12"
  azureSubscriptionServiceConnection: "prod-pneumorpheus-server"
  azureLocation: "norwayeast"
  createInfrastructure: "true"

  acrName: "pneumorpheusacr"
  appServicePlanName: "pneumorpheus-plan"
  keyVaultName: "PneumOrpheus"
  webAppResourceGroup: "AI-Diagnostics-Norway"
  keyVaultInferenceApiKeySecretName: "MODEL-INFERENCE-API-KEY"

  inferenceImageRepository: "pneumorpheus-inference-server"
  webAppName: "PneumOrpheus-Server"

  modelSource: "azure_blob"
  modelLocalDir: "/models"
  azureStorageAccountUrl: "https://pneumorphstore.blob.core.windows.net"
  azureBlobContainer: "models"
  azureBlobPrefix: "models"

  tag: "$(Build.SourceBranchName)-$(Build.BuildId)"

stages:
  - stage: Provision
    displayName: "Provision Infrastructure (optional)"
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Bootstrap
        displayName: "Create Azure resources if missing"
        pool:
          name: "$(agentPoolName)"
        steps:
          - task: AzureCLI@2
            displayName: "Provision resource group, ACR, plan, web app"
            condition: and(succeeded(), eq(variables['createInfrastructure'], 'true'))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                ensure_provider_registered() {
                  local namespace="$1"
                  local state

                  state=$(az provider show --namespace "$namespace" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
                  if [[ "$state" != "Registered" ]]; then
                    echo "Registering resource provider: $namespace"
                    az provider register --namespace "$namespace" --wait --output none
                  fi
                }

                ensure_provider_registered "Microsoft.Resources"
                ensure_provider_registered "Microsoft.ContainerRegistry"
                ensure_provider_registered "Microsoft.Web"
                ensure_provider_registered "Microsoft.KeyVault"
                ensure_provider_registered "Microsoft.Storage"

                if [[ -z "$(webAppResourceGroup)" || -z "$(webAppName)" || -z "$(acrName)" || -z "$(appServicePlanName)" ]]; then
                  echo "webAppResourceGroup, webAppName, acrName and appServicePlanName are required for createInfrastructure=true."
                  exit 1
                fi

                az group create \
                  --name "$(webAppResourceGroup)" \
                  --location "$(azureLocation)" \
                  --output none

                if ! az acr show --name "$(acrName)" --resource-group "$(webAppResourceGroup)" >/dev/null 2>&1; then
                  az acr create \
                    --name "$(acrName)" \
                    --resource-group "$(webAppResourceGroup)" \
                    --sku Basic \
                    --admin-enabled false \
                    --output none
                fi

                if ! az appservice plan show --name "$(appServicePlanName)" --resource-group "$(webAppResourceGroup)" >/dev/null 2>&1; then
                  az appservice plan create \
                    --name "$(appServicePlanName)" \
                    --resource-group "$(webAppResourceGroup)" \
                    --sku B1 \
                    --is-linux \
                    --output none
                fi

                if ! az webapp show --name "$(webAppName)" --resource-group "$(webAppResourceGroup)" >/dev/null 2>&1; then
                  az webapp create \
                    --name "$(webAppName)" \
                    --resource-group "$(webAppResourceGroup)" \
                    --plan "$(appServicePlanName)" \
                    --deployment-container-image-name "mcr.microsoft.com/azuredocs/aci-helloworld" \
                    --output none
                fi

                if [[ -n "$(keyVaultName)" ]] && ! az keyvault show --name "$(keyVaultName)" --resource-group "$(webAppResourceGroup)" >/dev/null 2>&1; then
                  az keyvault create \
                    --name "$(keyVaultName)" \
                    --resource-group "$(webAppResourceGroup)" \
                    --location "$(azureLocation)" \
                    --enable-rbac-authorization true \
                    --output none
                fi

  - stage: Validate
    displayName: "Validate"
    dependsOn: Provision
    condition: succeeded()
    jobs:
      - job: PythonChecks
        displayName: "Python compile check"
        pool:
          name: "$(agentPoolName)"
        steps:
          - checkout: self

          - script: |
              python3 --version
              python3 -m pip install --upgrade pip
              python3 -m pip install -r requirements.txt
              python3 -m pip install ./sclc_pkg
            displayName: "Install dependencies (including bundled sclc)"

          - script: python3 -m compileall app
            displayName: "Compile app"

  - stage: Containerize
    displayName: "Build and Push"
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildPush
        pool:
          name: "$(agentPoolName)"
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Build and push image in ACR"
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                if [[ -z "$(acrName)" ]]; then
                  echo "acrName is required."
                  exit 1
                fi

                az acr build \
                  --registry "$(acrName)" \
                  --image "$(inferenceImageRepository):$(tag)" \
                  --image "$(inferenceImageRepository):latest" \
                  --file "$(Build.SourcesDirectory)/Dockerfile" \
                  "$(Build.SourcesDirectory)"

  - stage: Deploy
    displayName: "Deploy (optional)"
    dependsOn: Containerize
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DeployContainer
        pool:
          name: "$(agentPoolName)"
        steps:
          - task: AzureCLI@2
            displayName: "Pre-deploy validation"
            condition: and(succeeded(), ne(variables['webAppName'], ''))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                if [[ -z "$(webAppResourceGroup)" ]]; then
                  echo "webAppResourceGroup is required when webAppName is set."
                  exit 1
                fi

                if [[ -z "$(acrName)" ]]; then
                  echo "acrName is required when webAppName is set."
                  exit 1
                fi

                if [[ -n "$(keyVaultInferenceApiKeySecretName)" && -z "$(keyVaultName)" ]]; then
                  echo "keyVaultName is required when keyVaultInferenceApiKeySecretName is set."
                  exit 1
                fi

                if [[ "$(modelSource)" == "azure_blob" ]]; then
                  if [[ -z "$(azureStorageAccountUrl)" ]]; then
                    echo "azureStorageAccountUrl is required when modelSource=azure_blob."
                    exit 1
                  fi

                  if [[ -z "$(azureBlobContainer)" ]]; then
                    echo "azureBlobContainer is required when modelSource=azure_blob."
                    exit 1
                  fi
                fi

                if [[ -n "$(keyVaultInferenceApiKeySecretName)" ]]; then
                  az keyvault secret show \
                    --vault-name "$(keyVaultName)" \
                    --name "$(keyVaultInferenceApiKeySecretName)" \
                    --query id -o tsv >/dev/null
                fi

          - task: AzureCLI@2
            displayName: "Deploy and configure inference server"
            condition: and(succeeded(), ne(variables['webAppName'], ''), ne(variables['webAppResourceGroup'], ''))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                acr_login_server="$(acrName).azurecr.io"
                image_name="${acr_login_server}/$(inferenceImageRepository):$(tag)"

                if ! az webapp show --name "$(webAppName)" --resource-group "$(webAppResourceGroup)" >/dev/null 2>&1; then
                  if ! az appservice plan show --name "$(appServicePlanName)" --resource-group "$(webAppResourceGroup)" >/dev/null 2>&1; then
                    echo "Web App $(webAppName) does not exist and App Service plan $(appServicePlanName) was not found in $(webAppResourceGroup)."
                    echo "Create the plan first or set createInfrastructure=true for a bootstrap run."
                    exit 1
                  fi

                  az webapp create \
                    --name "$(webAppName)" \
                    --resource-group "$(webAppResourceGroup)" \
                    --plan "$(appServicePlanName)" \
                    --deployment-container-image-name "mcr.microsoft.com/azuredocs/aci-helloworld" \
                    --output none
                fi

                az webapp identity assign \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --output none

                principal_id=$(az webapp identity show \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --query principalId -o tsv)

                if [[ -z "$principal_id" ]]; then
                  echo "Unable to resolve managed identity principalId for web app $(webAppName)."
                  exit 1
                fi

                acr_id=$(az acr show \
                  --name "$(acrName)" \
                  --resource-group "$(webAppResourceGroup)" \
                  --query id -o tsv)

                az role assignment create \
                  --assignee-object-id "$principal_id" \
                  --assignee-principal-type ServicePrincipal \
                  --role AcrPull \
                  --scope "$acr_id" \
                  --output none || true

                if [[ "$(modelSource)" == "azure_blob" ]]; then
                  storage_account_name=$(echo "$(azureStorageAccountUrl)" | sed -E 's#https://([^.]+)\..*#\1#')

                  if [[ -z "$storage_account_name" || "$storage_account_name" == "$(azureStorageAccountUrl)" ]]; then
                    echo "Unable to parse storage account name from azureStorageAccountUrl=$(azureStorageAccountUrl)."
                    exit 1
                  fi

                  storage_account_id=$(az storage account show \
                    --name "$storage_account_name" \
                    --resource-group "$(webAppResourceGroup)" \
                    --query id -o tsv)

                  if [[ -z "$storage_account_id" ]]; then
                    echo "Unable to resolve storage account id for '$storage_account_name'."
                    exit 1
                  fi

                  az role assignment create \
                    --assignee-object-id "$principal_id" \
                    --assignee-principal-type ServicePrincipal \
                    --role "Storage Blob Data Reader" \
                    --scope "$storage_account_id" \
                    --output none || true
                fi

                if [[ -n "$(keyVaultName)" ]]; then
                  keyvault_id=$(az keyvault show \
                    --name "$(keyVaultName)" \
                    --resource-group "$(webAppResourceGroup)" \
                    --query id -o tsv)

                  if [[ -z "$keyvault_id" ]]; then
                    echo "Unable to resolve Key Vault id for $(keyVaultName)."
                    exit 1
                  fi

                  az role assignment create \
                    --assignee-object-id "$principal_id" \
                    --assignee-principal-type ServicePrincipal \
                    --role "Key Vault Secrets User" \
                    --scope "$keyvault_id" \
                    --output none || true
                fi

                az webapp config set \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --generic-configurations '{"acrUseManagedIdentityCreds": true}' \
                  --output none

                az webapp config container set \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --container-image-name "$image_name" \
                  --container-registry-url "https://${acr_login_server}" \
                  --output none

                az webapp config appsettings set \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --settings \
                    WEBSITES_PORT="8001" \
                    APP_ENV="production" \
                    MODEL_SOURCE="$(modelSource)" \
                    MODEL_LOCAL_DIR="$(modelLocalDir)" \
                    AZURE_STORAGE_ACCOUNT_URL="$(azureStorageAccountUrl)" \
                    AZURE_BLOB_CONTAINER="$(azureBlobContainer)" \
                    AZURE_BLOB_PREFIX="$(azureBlobPrefix)" \
                  --output none

                if [[ -n "$(keyVaultInferenceApiKeySecretName)" ]]; then
                  inference_api_key=$(az keyvault secret show \
                    --vault-name "$(keyVaultName)" \
                    --name "$(keyVaultInferenceApiKeySecretName)" \
                    --query value -o tsv)

                  az webapp config appsettings set \
                    --resource-group "$(webAppResourceGroup)" \
                    --name "$(webAppName)" \
                    --settings INFERENCE_API_KEY="$inference_api_key" \
                    --output none
                fi
