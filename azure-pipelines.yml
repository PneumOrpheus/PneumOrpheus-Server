trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  pythonVersion: "3.12"
  dockerRegistryServiceConnection: "YOUR_ACR_SERVICE_CONNECTION"
  azureSubscriptionServiceConnection: "YOUR_AZURE_SUBSCRIPTION_SERVICE_CONNECTION"
  acrLoginServer: "yourregistry.azurecr.io"

  keyVaultName: ""
  webAppResourceGroup: ""
  keyVaultInferenceApiKeySecretName: ""

  inferenceImageRepository: "pneumorpheus-inference-server"
  webAppName: ""

  modelSource: "azure_blob"
  modelLocalDir: "/models"
  azureBlobContainer: ""
  azureBlobPrefix: "models"

  tag: "$(Build.SourceBranchName)-$(Build.BuildId)"

stages:
  - stage: Validate
    displayName: "Validate"
    jobs:
      - job: PythonChecks
        displayName: "Python compile check"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: "Install dependencies"

          - script: python -m compileall app
            displayName: "Compile app"

  - stage: Containerize
    displayName: "Build and Push"
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildPush
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: Docker@2
            displayName: "Build and push inference image"
            inputs:
              command: buildAndPush
              repository: "$(inferenceImageRepository)"
              dockerfile: "$(Build.SourcesDirectory)/Dockerfile"
              buildContext: "$(Build.SourcesDirectory)"
              containerRegistry: "$(dockerRegistryServiceConnection)"
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: "Deploy (optional)"
    dependsOn: Containerize
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DeployContainer
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: AzureCLI@2
            displayName: "Pre-deploy validation"
            condition: and(succeeded(), ne(variables['webAppName'], ''))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                if [[ -z "$(webAppResourceGroup)" ]]; then
                  echo "webAppResourceGroup is required when webAppName is set."
                  exit 1
                fi

                if [[ -n "$(keyVaultInferenceApiKeySecretName)" && -z "$(keyVaultName)" ]]; then
                  echo "keyVaultName is required when keyVaultInferenceApiKeySecretName is set."
                  exit 1
                fi

                if [[ -n "$(keyVaultInferenceApiKeySecretName)" ]]; then
                  az keyvault secret show \
                    --vault-name "$(keyVaultName)" \
                    --name "$(keyVaultInferenceApiKeySecretName)" \
                    --query id -o tsv >/dev/null
                fi

          - task: AzureWebAppContainer@1
            displayName: "Deploy inference container"
            condition: and(succeeded(), ne(variables['webAppName'], ''))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              appName: "$(webAppName)"
              containers: "$(acrLoginServer)/$(inferenceImageRepository):$(tag)"

          - task: AzureCLI@2
            displayName: "Configure inference app settings"
            condition: and(succeeded(), ne(variables['webAppName'], ''), ne(variables['webAppResourceGroup'], ''))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                az webapp config appsettings set \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --settings \
                    WEBSITES_PORT="8001" \
                    APP_ENV="production" \
                    MODEL_SOURCE="$(modelSource)" \
                    MODEL_LOCAL_DIR="$(modelLocalDir)" \
                    AZURE_BLOB_CONTAINER="$(azureBlobContainer)" \
                    AZURE_BLOB_PREFIX="$(azureBlobPrefix)" \
                  --output none

                if [[ -n "$(keyVaultInferenceApiKeySecretName)" ]]; then
                  inference_api_key=$(az keyvault secret show \
                    --vault-name "$(keyVaultName)" \
                    --name "$(keyVaultInferenceApiKeySecretName)" \
                    --query value -o tsv)

                  az webapp config appsettings set \
                    --resource-group "$(webAppResourceGroup)" \
                    --name "$(webAppName)" \
                    --settings INFERENCE_API_KEY="$inference_api_key" \
                    --output none
                fi
